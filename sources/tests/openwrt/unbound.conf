server:
    interface: 127.0.0.1@15353
    username: ""
    chroot: ""
    directory: "/tmp"
    pidfile: ""
    do-daemonize: no
    use-syslog: no
    module-config: "iterator"
    # Synthetic fixtures must never recurse to an external DNS service.
    local-zone: "." refuse
    local-zone: "example.net." static
    local-data: "selected.example.net. 60 IN A 203.0.113.2"
    local-data: "router.example.net. 60 IN A 192.0.2.1"
    local-data: "ordinary.example.net. 60 IN A 203.0.113.2"
    local-data: "nested.selected.example.net. 60 IN A 203.0.113.2"
    local-data: "alias.example.net. 60 IN CNAME rewritten.example.net."
    local-data: "rewritten.example.net. 60 IN A 203.0.113.2"
