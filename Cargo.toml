[workspace]
members = ["sources/core", "sources/service", "sources/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"

[workspace.dependencies]
hickory-proto = "0.26.1"
idna = "1.1.0"
ipnet = { version = "2.12.0", features = ["serde"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
thiserror = "2.0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "signal", "sync", "macros", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
tunnel-detour-core = { path = "sources/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
